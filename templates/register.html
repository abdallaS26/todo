<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>
<body>
    <main>
        <section class="card form-card">
            <h1>Create Account</h1>
            <form method="post" action="{{ url_for('auth_register') }}">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Full name" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Email address" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Choose a password" required>

                <button type="submit">Register</button>
            </form>
            <p class="form-footer">Already have an account? <a href="{{ url_for('login_page') }}">Login</a></p>
        </section>
    </main>
</body>
</html>
